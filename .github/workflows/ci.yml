name: CI/CD, Docker Compose + Docker Hub

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker images
        run: docker compose -f docker-compose.yml build

      - name: Push Docker images
        run: |
          docker tag devmery/flask-api:latest ${{ secrets.DOCKER_USERNAME }}/devmery/flask-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/devmery/flask-api:latest

          docker tag devmery/flask-app:latest ${{ secrets.DOCKER_USERNAME }}/devmery/flask-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/devmery/flask-app:latest